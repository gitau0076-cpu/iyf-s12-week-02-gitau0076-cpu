<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box Model Practice</title>
    <style>
        /* Global Reset */
         * {
            box-sizing: border-box ;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: "Lato", sans-serif;
            padding: 20px;
            background-color: #2c3e50;
        }
        section {
            margin-bottom: 40px;
            background: #334155;
            padding: 25px;
        }
        /* EXERCISE 1: BOX MODEL VISUALIZATION */
        .box-content, .box-padding, .box-border, .box-margin {
            width: 250px;
            color: white;
            margin-bottom: 15px;
        }
        /* 1. Content: Background color only */
           .box-content {
             background-color: #e74c3c;
           }
        /* 2. Padding: Larger click/background area */
        .box-padding {
            background-color: #e67e22;
            padding: 20px;
        }
        /* 3. Border:Visible border around box */
        .box-border {
            background-color: #f1c40f;
            color: #2c3e50;
            padding: 20px;
            border: 4px solid #16a085;
        }
        /* 4. Margin: Creates space outside between boxes */
        .box-margin {
            background-color: #2ecc71;
            color: #2c3e50;
            padding: 20px;
            border: 4px solid #16a085;
            margin-top: 25px;
        }
        /* EXERCISE 2: DEBUG THE LAYOUT */
        .broken-box {
            box-sizing: border-box;
            width: 300px;
            padding: 20px;
            border: none;
            background-color: #3498db;
            }
        </style>
</head>
       <body>
        <!--EXERCISE 1 -->
        <section>
         <h1>Exercise 1: Box Model Visualization</h1>
        <div class="box-demo">Content (Background Color)</div>
        <div class="box-demo">Padding (Larger Click Area)</div>
        <div class="box-demo">Border (Visible Border)</div>
        <div class="box-demo">Margin (Space Between Boxes)</div>/* 1. Content: Just background color   
        </section>
        <!--EXERCISE 2 -->
       <section>
        <h2>Debug the Layout</h2>
        <div class="broken-box">
            Fixed Box (300px total width)
        </div> 
       </section>
         </body>


</html>
